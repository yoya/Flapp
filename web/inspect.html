<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flapp 解析（SWF インスペクタ）</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --chip: #f2f2f7; --accent: #0a66c2; --warn: #b3261e; --sel: #e8f0fe; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #3a3a3c; --chip: #2c2c2e; --accent: #64b5ff; --warn: #ff8a80; --sel: #1f3a5a; }
  }
  :root[data-theme="dark"] { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #3a3a3c; --chip: #2c2c2e; --accent: #64b5ff; --warn: #ff8a80; --sel: #1f3a5a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  .muted { color: var(--muted); }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .drop.over { border-color: var(--accent); background: var(--sel); }
  button, input[type=file] { font: inherit; }
  button { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
  .card b { display: block; font-size: 18px; }
  .card span { color: var(--muted); font-size: 12px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .warn { color: var(--warn); }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 60vh; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--bg); z-index: 1; }
  td.sum { white-space: normal; min-width: 220px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--chip); }
  tbody tr.sel { background: var(--sel); }
  .tag-section { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .detail { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .thumb { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; background: var(--chip); border-radius: 6px; color: var(--muted); }
  .big { margin: 0 0 12px; padding: 12px; background: var(--chip); border-radius: 8px; overflow: auto; max-height: 520px; text-align: center; }
  .big canvas { max-width: 100%; height: auto; background: repeating-conic-gradient(#8884 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  pre { background: var(--chip); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 6px 0 0; }
  .hidden { display: none; }
  .notice { border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; color: var(--warn); }
  @media (max-width: 600px) { main { padding: 12px; } .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>SWF インスペクタ</h1>
  <p><a href="index.html">再生</a> ・ 解析</p>
  <div class="notice hidden" id="notice" role="alert"></div>
  <div class="drop" id="drop">
    <input type="file" id="file" accept=".swf,application/x-shockwave-flash">
    <span class="muted">SWF をここへドラッグするか、ファイルを選ぶと、中身を表にします。読むだけで、実行はしません。</span>
  </div>
  <p class="muted" id="status"></p>

  <section id="report" class="hidden">
    <h2>ヘッダ</h2>
    <div class="kv" id="header"></div>
    <div id="warnings"></div>

    <h2>要約</h2>
    <div class="cards" id="cards"></div>
    <div class="kv" id="summary" style="margin-top:10px"></div>

    <h2>タグ</h2>
    <div class="toolbar" id="filters"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>深さ</th><th>位置</th><th>タグ</th><th>区分</th><th>ID</th><th>見本</th><th>内容</th><th>長さ</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="detail hidden" id="detail"></div>
  </section>
</main>

<script>
// モジュールのスクリプトは file:// では読めない。その場合も、SWF をドロップしたときにブラウザが SWF を開いて再生しないよう、先に止める。
(() => {
  const notice = document.getElementById('notice');
  const say = (text) => { notice.textContent = text; notice.classList.remove('hidden'); };
  for (const type of ['dragenter', 'dragover', 'drop']) window.addEventListener(type, (e) => e.preventDefault());
  if (location.protocol === 'file:') {
    say('このページは、ファイルとして開くと動きません。ターミナルで npm run serve を実行してから、http://127.0.0.1:8123/web/inspect.html を開いてください。');
  } else {
    setTimeout(() => { if (!window.flappInspectorReady) say('スクリプトを読み込めません。npm run serve で配信したページを、http:// で開いてください。'); }, 1500);
  }
})();
</script>
<script type="module">
window.flappInspectorReady = true;
import { inspectSWF, previewKind } from './inspect.js';
import { drawPreview, lazyThumbs } from './preview.js';

const SECTION_NAME = { control: '制御', display: '表示', action: 'スクリプト', definition: '定義', sprite: 'スプライト', sound: '音', video: '動画', other: 'その他' };
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const kv = (pairs) => pairs.map(([k, v]) => `<div>${esc(k)}</div><div>${esc(v)}</div>`).join('');
const fmtBytes = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);

let report = null;
let current = 'all';

function renderHeader(h) {
  $('header').innerHTML = kv([
    ['シグネチャ', `${h.signature}（${h.compression}）`],
    ['SWF のバージョン', h.version],
    ['ファイルの長さ', `${fmtBytes(h.fileLength)}（${h.fileLength} バイト）`],
    ['ステージ', `${h.width} × ${h.height} px`],
    ['フレームレート', `${h.frameRate} fps`],
    ['フレーム数', h.frameCount],
  ]);
  $('warnings').innerHTML = h.warnings.length ? `<p class="warn">注意: ${h.warnings.map(esc).join(' / ')}</p>` : '';
}

function renderSummary(s) {
  const cards = [
    ['タグ', s.tagCount], ['フレーム', s.frames], ['ラベル', s.labels.length], ['スプライト', s.sprites],
    ['ABC のクラス', s.classes.length], ['シンボルのクラス', s.symbolClasses.length],
  ];
  for (const [name, n] of Object.entries(s.sections)) cards.push([SECTION_NAME[name] ?? name, n]);
  $('cards').innerHTML = cards.map(([k, v]) => `<div class="card"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');
  const defs = Object.entries(s.definitions).map(([k, v]) => `${k} ${v}`).join('、') || 'なし';
  const labels = s.labels.map((l) => `${l.name}（${l.frame}）`).join('、') || 'なし';
  const symbols = s.symbolClasses.map((x) => `${x.id}: ${x.name}`).join('、') || 'なし';
  const exports = s.exports.map((x) => `${x.id}: ${x.name}`).join('、') || 'なし';
  const imports = s.imports.join('、') || 'なし';
  const classes = s.classes.join('、') || 'なし';
  const abc = s.abc.map((a) => `バージョン ${a.version}、クラス ${a.classes}、メソッド ${a.methods}、スクリプト ${a.scripts}`).join(' / ') || 'なし';
  $('summary').innerHTML = kv([
    ['背景色', s.background ?? '（指定なし）'],
    ['属性', s.attributes ? s.attributes.map(([, v]) => v).join(', ') : '（なし）'],
    ['スクリプトの制限', s.limits ?? '（指定なし）'],
    ['定義の種類', defs],
    ['フレームラベル', labels],
    ['シンボルのクラス', symbols],
    ['書き出し', exports],
    ['読み込み', imports],
    ['ActionScript 3 のクラス', classes],
    ['ABC', abc],
  ]);
}

function renderFilters() {
  const sections = ['all', ...new Set(report.tags.map((t) => t.section))];
  $('filters').innerHTML = sections.map((s) => `<button data-s="${s}" aria-pressed="${s === current}">${s === 'all' ? 'すべて' : esc(SECTION_NAME[s] ?? s)}</button>`).join('');
  $('filters').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; current = b.dataset.s; renderFilters(); renderRows(); };
}

// 見本を出せるか（シェイプ・スプライト・画像の定義）
const previewable = (t) => t.id !== null && previewKind(t.code) !== null;
let thumbs = null;

function renderRows() {
  const rows = report.tags.filter((t) => current === 'all' || t.section === current);
  $('rows').innerHTML = rows.map((t) => `<tr data-i="${t.index}">
      <td>${t.index}</td><td>${t.depth ? '　'.repeat(t.depth) + t.depth : 0}</td><td>${t.offset}</td>
      <td>${esc(t.name)}</td><td><span class="tag-section">${esc(SECTION_NAME[t.section] ?? t.section)}</span></td>
      <td>${t.id ?? ''}</td><td>${previewable(t) ? `<div class="thumb" data-i="${t.index}"></div>` : ''}</td>
      <td class="sum">${t.error ? `<span class="warn">${esc(t.summary)}</span>` : esc(t.summary)}</td><td>${t.length}</td></tr>`).join('');
  thumbs?.disconnect();
  thumbs = lazyThumbs($('rows'), report);
}

let detailToken = 0;
async function showDetail(t) {
  const token = ++detailToken;
  document.querySelectorAll('#rows tr.sel').forEach((r) => r.classList.remove('sel'));
  document.querySelector(`#rows tr[data-i="${t.index}"]`)?.classList.add('sel');
  const parent = t.parentSprite !== null ? `スプライト ${t.parentSprite} の中` : 'タイムライン';
  const details = t.details.length ? `<div class="kv">${kv(t.details)}</div>` : '';
  $('detail').innerHTML = `${previewable(t) ? '<div class="big" id="big">描いています…</div>' : ''}<h2 style="margin-top:0">${t.index}: ${esc(t.name)}（コード ${t.code}）</h2>
    <div class="kv">${kv([['位置', `展開後の ${t.offset} バイト目（長さ ${t.length}）`], ['場所', `${parent}、フレーム ${t.frame}`], ['区分', SECTION_NAME[t.section] ?? t.section], ['ID', t.id ?? '（なし）']])}</div>
    ${t.error ? `<p class="warn">解釈できません: ${esc(t.error)}</p>` : ''}
    ${details}
    <h2>中身（先頭 256 バイト）</h2>
    <pre>${esc(t.hex)}</pre>`;
  $('detail').classList.remove('hidden');
  $('detail').scrollIntoView({ block: 'nearest' });
  if (!previewable(t)) return;
  let big = null;
  try {
    big = await drawPreview(report, t, 480);
  } catch (e) {
    big = null;
    if (token === detailToken && $('big')) $('big').textContent = `描けません: ${e.message}`;
    return;
  }
  if (token !== detailToken || !$('big')) return; // 別の行を選んだ後は、描いた結果を捨てる
  $('big').replaceChildren(big ?? '描けません');
}

function show(r) {
  report = r;
  $('report').classList.remove('hidden');
  renderHeader(r.header);
  renderSummary(r.summary);
  renderFilters();
  renderRows();
  $('detail').classList.add('hidden');
}

async function load(bytes, label) {
  $('status').textContent = `${label} を読んでいます…`;
  try {
    const r = await inspectSWF(bytes);
    $('status').textContent = `${label}（${fmtBytes(bytes.length)}）`;
    show(r);
  } catch (e) {
    $('status').innerHTML = `<span class="warn">SWF として読めません: ${esc(e.message)}</span>`;
    $('report').classList.add('hidden');
  }
}

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (f) await load(new Uint8Array(await f.arrayBuffer()), f.name);
});
// ページのどこに落としても、ブラウザが SWF を開いて再生してしまわないよう、ページ全体をドロップ先にする。
for (const type of ['dragenter', 'dragover']) window.addEventListener(type, (e) => { e.preventDefault(); $('drop').classList.add('over'); });
window.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) $('drop').classList.remove('over'); });
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  $('drop').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) await load(new Uint8Array(await f.arrayBuffer()), f.name);
});
$('rows').addEventListener('click', (e) => {
  const tr = e.target.closest('tr');
  if (tr) showDetail(report.tags[Number(tr.dataset.i)]);
});

// ?src=../test/fixtures/x.swf のように、同じサイトの SWF を直接開ける。
const src = new URLSearchParams(location.search).get('src');
if (src) {
  try {
    const res = await fetch(new URL(src, location.href));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    await load(new Uint8Array(await res.arrayBuffer()), src);
  } catch (e) {
    $('status').innerHTML = `<span class="warn">読み込めません: ${esc(e.message)}</span>`;
  }
}
</script>
</body>
</html>
