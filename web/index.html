<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flapp</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
  canvas { display: block; margin: 12px 0; border: 1px solid #888; }
  #info, #warnings, #traces { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  #warnings { color: #a40; }
  #traces { max-height: 240px; overflow: auto; border: 1px solid #ccc; padding: 4px 8px; margin-top: 8px; }
  #traces:empty { display: none; }
</style>
<h1>Flapp</h1>
<p>SWF ファイル（または FLV ファイル）を選ぶか、ここにドロップしてください。<input type="file" id="file" accept=".swf,.flv"></p>
<p>
  <label>SWF 5 以前の文字コード:
    <select id="encoding">
      <option value="shift_jis">日本語 (Shift-JIS)</option>
      <option value="windows-1252">西欧 (Windows-1252)</option>
      <option value="euc-kr">韓国語 (EUC-KR)</option>
      <option value="gbk">中国語・簡体字 (GBK)</option>
      <option value="big5">中国語・繁体字 (Big5)</option>
    </select>
  </label>
</p>
<canvas id="stage" width="0" height="0"></canvas>
<div id="info"></div>
<div id="warnings"></div>
<div id="traces"></div>
<script type="module">
  import { Movie } from '../src/player/movie.js';
  import { CanvasRenderer } from '../src/render/canvas.js';
  import { WebAudioOutput } from '../src/audio/webaudio.js';
  import { SoundMixer } from '../src/player/sound.js';
  import { FlvPlayback } from '../src/player/video.js';
  import { parseFLV } from '../src/video/flv.js';
  import { WebCodecsVideo } from '../src/video/webcodecs.js';

  const canvas = document.getElementById('stage');
  const renderer = new CanvasRenderer(canvas);
  let timer = 0;
  // 音の出力。ブラウザは利用者の操作があるまで音を出さないので、最初のクリックやキー操作で有効にする。
  const audio = new WebAudioOutput();
  window.flappAudio = audio; // 開発用（コンソールから audio.level() で音が出ているかを確かめられる）
  // 有効になったら、流れている途中のストリーム音を次のフレームで鳴らし直させる。
  for (const type of ['pointerdown', 'keydown']) {
    window.addEventListener(type, () => {
      if (audio.context.state === 'suspended') audio.resume().then(() => (current?.sounds ?? videoSounds)?.resync());
    }, { capture: true });
  }
  let current = null; // 再生中のムービー
  let loaded = null; // 再生中のファイル { bytes, label, base }（文字コードを変えたときに読み直す）

  // SWF 5 以前の文字列は、ファイルを作った環境の文字コードで入っている（ファイルからは判別できない）。
  // 実機は OS の言語に合わせるので、ここではブラウザの言語から初期値を決める。?encoding= でも指定できる。
  const encoding = document.getElementById('encoding');
  const language = navigator.language.toLowerCase();
  encoding.value = new URLSearchParams(location.search).get('encoding')
    ?? (language.startsWith('ja') ? 'shift_jis' : language.startsWith('ko') ? 'euc-kr'
      : /^zh-(tw|hk|hant)/.test(language) ? 'big5' : language.startsWith('zh') ? 'gbk' : 'windows-1252');
  if (!encoding.value) encoding.value = 'windows-1252'; // 一覧に無い指定
  encoding.addEventListener('change', () => { if (loaded) play(loaded.bytes, loaded.label, loaded.base); });

  let redraw = () => {}; // 再生中のムービーを描き直す
  let stopVideo = () => {}; // 再生中の FLV を止める
  let videoSounds = null; // 再生中の FLV の音
  const video = WebCodecsVideo.supported ? new WebCodecsVideo() : undefined; // H.264 は、ブラウザのデコーダで復号する

  // FLV ファイルを、そのまま再生する。
  function playFLV(bytes, label, info, warnings) {
    let flv;
    try {
      flv = parseFLV(new Uint8Array(bytes));
    } catch (e) {
      info.textContent = `${label}: ${e.message}`;
      return;
    }
    const started = performance.now();
    const host = { now: () => performance.now() - started, video, warn: (message) => { warnings.textContent += `${message}\n`; } };
    host.sounds = videoSounds = new SoundMixer(host, audio);
    const playback = new FlvPlayback(host, flv);
    playback.play(0);
    stopVideo = () => playback.close();
    const ctx = canvas.getContext('2d');
    timer = setInterval(() => {
      const image = playback.image();
      if (image) {
        if (canvas.width !== image.width || canvas.height !== image.height) Object.assign(canvas, { width: image.width, height: image.height });
        canvas.style.width = `${image.width}px`;
        canvas.style.height = `${image.height}px`;
        if (image.image) ctx.drawImage(image.image, 0, 0);
        else ctx.putImageData(new ImageData(image.rgba, image.width, image.height), 0, 0);
      }
      const codec = flv.video[0]?.codec ?? 'no video';
      info.textContent = `${label}: FLV, ${codec}${flv.audio[0] ? ` + ${flv.audio[0].format}` : ''}, ${(playback.time / 1000).toFixed(2)} / ${(playback.duration / 1000).toFixed(2)} s`;
      if (playback.finished()) clearInterval(timer);
    }, 1000 / 30);
  }

  // マウスとキーの入力をムービーへ伝える（_xmouse / _ymouse、ボタン）。キー入力は、ステージをクリックして選んでいる間だけ受け取る。
  const input = (handle) => (e) => {
    if (!current) return;
    handle(current, e);
    canvas.style.cursor = current.avm && !current.avm.mouseVisible ? 'none' : current.hoverButton ? 'pointer' : '';
    redraw();
  };
  const moveTo = (movie, e) => {
    const rect = canvas.getBoundingClientRect();
    movie.mouseMove(Math.round((e.clientX - rect.left) * 20), Math.round((e.clientY - rect.top) * 20));
  };
  canvas.tabIndex = 0;
  canvas.addEventListener('mousemove', input(moveTo));
  canvas.addEventListener('mouseleave', input((movie) => movie.mouseLeave()));
  canvas.addEventListener('mousedown', input((movie, e) => { moveTo(movie, e); movie.mouseDown(); }));
  window.addEventListener('mouseup', input((movie) => movie.mouseUp()));
  // キーは仮想キーコード（Key.getCode() の値）と文字コード（Key.getAscii() の値）で渡す。
  canvas.addEventListener('keydown', input((movie, e) => {
    if (!e.keyCode || e.metaKey) return;
    e.preventDefault();
    movie.keyDown(e.keyCode, e.key.length === 1 && e.key >= ' ' && e.key <= '~' ? e.key.charCodeAt(0) : e.key === 'Enter' ? 13 : 0);
  }));
  canvas.addEventListener('keyup', input((movie, e) => { if (e.keyCode) movie.keyUp(e.keyCode); }));

  // base は、?swf= で読んだときの SWF の URL。そのときだけ、NetStream.play が求めたファイルを同じサーバの中から渡す。
  async function play(bytes, label, base) {
    clearInterval(timer);
    stopVideo();
    stopVideo = () => {};
    const info = document.getElementById('info');
    const warnings = document.getElementById('warnings');
    warnings.textContent = '';
    if (String.fromCharCode(...new Uint8Array(bytes, 0, Math.min(3, bytes.byteLength))) === 'FLV') {
      current?.sounds.stop();
      current = null;
      document.getElementById('traces').textContent = '';
      playFLV(bytes, label, info, warnings);
      return;
    }
    const media = base && (async (url) => {
      const target = new URL(url, new URL(base, location.href));
      if (target.origin !== location.origin) return null;
      const res = await fetch(target);
      return res.ok ? new Uint8Array(await res.arrayBuffer()) : null;
    });
    // trace() の出力。画面に残すのは最後の 500 行まで。
    const traces = document.getElementById('traces');
    traces.textContent = '';
    const lines = [];
    const trace = (text) => {
      lines.push(text);
      if (lines.length > 500) lines.shift();
      traces.textContent = lines.join('\n');
      traces.scrollTop = traces.scrollHeight;
    };
    // スクリプトが要求した URL は、開かずに trace の欄へ表示する（NetStream.play のファイルだけは、?swf= で読んだときに同じサーバから渡す）。
    const onRequest = ({ kind, url, target, method }) => trace(`[${kind}${method ? ' ' + method : ''}] ${url}${target ? ' → ' + target : ''} ${kind === 'play' && base ? '（同じサーバから読みます）' : '（開きません）'}`);
    let movie;
    try {
      current?.sounds.stop(); // 前のムービーの音を止める
      movie = await Movie.load(bytes, { trace, onRequest, audio, video, media, rasterize: renderer.rasterizer(), encoding: encoding.value, language: navigator.language.slice(0, 2) });
    } catch (e) {
      info.textContent = `${label}: ${e.message}`;
      return;
    }
    await renderer.prepare(movie);
    current = movie;
    loaded = { bytes, label, base };
    const scale = window.devicePixelRatio || 1;
    const draw = () => {
      renderer.render(movie, scale);
      canvas.style.width = `${canvas.width / scale}px`;
      canvas.style.height = `${canvas.height / scale}px`;
      info.textContent = `${label}: SWF ${movie.version}, ${movie.frameRate} fps, ` +
        `frame ${movie.root.currentFrame} / ${movie.root.totalFrames}`;
      warnings.textContent = movie.warnings.join('\n');
    };
    draw();
    redraw = draw;
    // フレームレート 0 は実質停止として扱う。
    if (movie.frameRate > 0) {
      timer = setInterval(() => {
        movie.advance();
        draw();
      }, 1000 / movie.frameRate);
    }
  }

  document.getElementById('file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (file) play(await file.arrayBuffer(), file.name);
  });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) play(await file.arrayBuffer(), file.name);
  });

  // 開発用: ?swf=../test/fixtures/xxx.swf で同じサーバ上のファイルを再生する。
  const param = new URLSearchParams(location.search).get('swf');
  if (param) {
    const res = await fetch(param);
    if (res.ok) play(await res.arrayBuffer(), param, param);
    else document.getElementById('info').textContent = `${param}: HTTP ${res.status}`;
  }
</script>
</html>
